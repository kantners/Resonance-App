<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resonance — Reading log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;display=swap">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#15191C;background:#F3F4F1}
a{color:#1F5FA8}a:hover{color:#174A84}
input,button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 12px 24px 32px; background: #F3F4F1; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #15191C">
<header style="display: flex; flex-direction: column; gap: 4px">
<a href="Main.dc.html" style="align-self: flex-start; display: flex; align-items: center; gap: 2px; min-height: 44px; font-size: 15px; font-weight: 500; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Brief</a>
<div style="display: flex; justify-content: space-between; align-items: baseline">
<h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 30px; line-height: 1.1">Reading</h1>
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; color: #545B61">THU · SEP 24</span>
</div>
</header>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 10px; font-size: 15px; font-weight: 600">What did you read on?</legend>

<button type="button" aria-pressed="{{ book.on }}" onClick="{{ book.pick }}" style="display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; text-align: left; padding: 14px; border-radius: 14px; background: #FFFFFF; cursor: pointer; border: 1px solid {{ book.bc }}; box-shadow: {{ book.sh }}">
<span style="width: 56px; height: 56px; border-radius: 12px; background: #EEF0EC; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#15191C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5c3-1.3 6-1.3 9 .5 3-1.8 6-1.8 9-.5V19c-3-1.3-6-1.3-9 .5-3-1.8-6-1.8-9-.5z"></path><path d="M12 6v13.5"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 600">Physical book</span>
<span style="font-size: 13px; color: #3E454B">Paper. No screen involved.</span>
<span style="align-self: flex-start; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 6px; background: #E6ECF4; color: #174A84">SCREEN-FREE</span>
</span>
</button>

<button type="button" aria-pressed="{{ ereader.on }}" onClick="{{ ereader.pick }}" style="display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; text-align: left; padding: 14px; border-radius: 14px; background: #FFFFFF; cursor: pointer; border: 1px solid {{ ereader.bc }}; box-shadow: {{ ereader.sh }}">
<span style="width: 56px; height: 56px; border-radius: 12px; background: #EEF0EC; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#15191C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2"></rect><path d="M8 7h8M8 10h8M8 13h5"></path><path d="M10.5 18.5h3"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 600">E-reader, offline</span>
<span style="font-size: 13px; color: #3E454B">E-ink device, no notifications.</span>
<span style="align-self: flex-start; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 6px; background: #EEF0EC; color: #3E454B">LOW-STIMULUS SCREEN</span>
</span>
</button>

<button type="button" aria-pressed="{{ app.on }}" onClick="{{ app.pick }}" style="display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; text-align: left; padding: 14px; border-radius: 14px; background: #FFFFFF; cursor: pointer; border: 1px solid {{ app.bc }}; box-shadow: {{ app.sh }}">
<span style="width: 56px; height: 56px; border-radius: 12px; background: #FBEDE2; display: flex; align-items: center; justify-content: center">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8A3C06" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path><path d="M2.5 8.5l2 1M2.5 14.5l2-1M21.5 8.5l-2 1M21.5 14.5l-2-1"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 16px; font-weight: 600">Phone or tablet app</span>
<span style="font-size: 13px; color: #3E454B">Backlit, connected screen.</span>
<span style="align-self: flex-start; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 6px; background: #FBEDE2; color: #8A3C06">COUNTS AS SCREEN TIME</span>
</span>
</button>
</fieldset>

<sc-if value="{{ isApp }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #FBEDE2; font-size: 13px; line-height: 1.45; color: #6E3005">This session will also be added to Thursday's digital exposure, unless that day's screenshot already includes it.</p>
</sc-if>

<section aria-label="Duration" style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 600">Duration</span>
<div style="display: grid; grid-template-columns: 52px 1fr 52px; gap: 10px; align-items: center">
<button type="button" aria-label="Five minutes less" onClick="{{ minus }}" style="height: 52px; border-radius: 12px; border: 1px solid #C9CFCB; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<div style="display: flex; align-items: baseline; justify-content: center; gap: 6px"><span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 34px; font-weight: 500">{{ minutes }}</span><span style="font-size: 14px; color: #545B61">min</span></div>
<button type="button" aria-label="Five minutes more" onClick="{{ plus }}" style="height: 52px; border-radius: 12px; border: 1px solid #C9CFCB; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="r-title" style="font-size: 15px; font-weight: 600">Title <span style="font-weight: 400; font-size: 13px; color: #545B61">· optional</span></label>
<input id="r-title" placeholder="What were you reading?" style="height: 48px; box-sizing: border-box; border: 1px solid #C9CFCB; border-radius: 10px; padding: 0 14px; background: #FFFFFF; font-size: 15px">
</div>

<button type="button" style="min-height: 52px; border-radius: 12px; border: 0; background: #15191C; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer">Save session</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { medium: 'ereader', minutes: 35 };
}
opt(id) {
const on = this.state.medium === id;
return {
on: on,
bc: on ? '#15191C' : '#D9DDDA',
sh: on ? '0 0 0 1px #15191C' : 'none',
pick: () => this.setState({ medium: id })
};
}
renderVals() {
const m = this.state.minutes;
return {
book: this.opt('physical'),
ereader: this.opt('ereader'),
app: this.opt('app'),
isApp: this.state.medium === 'app',
minutes: m,
minus: () => this.setState({ minutes: Math.max(5, m - 5) }),
plus: () => this.setState({ minutes: Math.min(480, m + 5) })
};
}
}
</script>
</body>
</html>
