<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" sizes="32x32" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#DDD5C6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A1620" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Resonance" />
    <!-- iOS Splash Screens -->
    <link rel="apple-touch-startup-image" href="/splash-1125x2436.png" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3)" />
    <link rel="apple-touch-startup-image" href="/splash-1242x2688.png" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3)" />
    <link rel="apple-touch-startup-image" href="/splash-828x1792.png"  media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:2)" />
    <link rel="apple-touch-startup-image" href="/splash-750x1334.png"  media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2)" />
    <link rel="apple-touch-startup-image" href="/splash-2048x2732.png" media="(device-width:1024px) and (device-height:1366px) and (-webkit-device-pixel-ratio:2)" />
    <link rel="apple-touch-startup-image" href="/splash-1668x2388.png" media="(device-width:834px) and (device-height:1194px) and (-webkit-device-pixel-ratio:2)" />
    <title>Resonance</title>
    <meta name="description" content="Resonance compares your HRV and resting heart rate with your own recent nights, alongside your screen time and the stillness you choose. A self-monitoring tool, not a medical assessment." />
    <script>
      // Apply an explicit Light/Dark choice before first paint. No saved choice
      // (or "system") leaves data-theme unset, so CSS follows the phone's setting.
      (function(){
        try {
          const saved = localStorage.getItem('resonance-theme');
          if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
        } catch(e) { /* storage blocked: follow the phone */ }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
