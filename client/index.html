    <title>KEWT — Kinetic Endurance Wellness Tracking</title>
    <meta name="description" content="Integrated wellness operating system: training, nutrition, breathwork, sleep, Reiki, and goal tracking for endurance athletes and practitioners." />
    <script>
      // Apply saved theme before first paint — no flash, no OS override
      (function(){
        try {
          const saved = localStorage.getItem('kewt-theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            // First visit: default to light (warm linen), ignore OS pref
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
