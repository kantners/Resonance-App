name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # Builds the production image exactly as Railway does, so Dockerfile problems
  # surface here first. Build only: the image is never pushed anywhere.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: resonance:ci
      - name: Image has what Railway's pre-deploy and start commands need
        run: |
          docker run --rm resonance:ci sh -c 'test -f dist/index.cjs && test -f drizzle.config.ts && ls migrations/*.sql && npx drizzle-kit --version'
          test "$(docker run --rm resonance:ci whoami)" = node
